name: Build APK Pamekasan
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Buildozer deps
        run: |
          pip install buildozer Cython==0.29.33
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk python3-pip libltdl-dev libffi-dev libssl-dev libbz2-dev
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Logger-Pamekasan-APK
          path: bin/*.apk
