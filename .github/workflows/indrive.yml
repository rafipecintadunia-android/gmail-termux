name: Notifikasi inDrive PERMANEN AKTIF
on:
  push:
    paths:
      - 'indrive_orders.log'
      - 'indrive_orders.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # JALAN OTOMATIS TIAP 5 MENIT PERMANEN!

jobs:
  kirim-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kirim laporan order permanen
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          pip install yagmail
          python -c '
          import yagmail, os, pathlib
          from datetime import datetime
          user = os.getenv("GMAIL_USER") or os.getenv("EMAIL_ADDRESS") or "rafipecintadunia@gmail.com"
          pwd = os.getenv("GMAIL_APP_PASSWORD") or os.getenv("EMAIL_PASSWORD")
          to = os.getenv("TO_EMAIL") or user
          if not pwd:
              print("Secret belum di-set")
              exit(0)
          try:
              log_path = pathlib.Path("indrive_orders.log")
              if log_path.exists():
                  isi = log_path.read_text()[-3000:]
              else:
                  isi = "Standby Krembangan - Belum ada order baru"
          except:
              isi = "Standby"
          jam = datetime.now().strftime("%H:%M WIB")
          print(f"[{jam}] Kirim dari {user} ke {to}")
          yag = yagmail.SMTP(user, pwd)
          yag.send(to=to, subject=f"🚗 inDrive AKTIF [{jam}] - Surabaya", contents=f"Halo Rafi,\n\nStatus PERMANEN AKTIF jam {jam}:\n\n{isi}\n\nLokasi: Krembangan\nNotifikasi ini akan jalan tiap 5 menit secara permanen!")
          print("Email permanen terkirim!")
          '
