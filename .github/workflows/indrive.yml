name: Notifikasi inDrive
on:
  push:
    paths:
      - 'indrive_orders.log'
      - 'indrive_orders.json'
  workflow_dispatch:

jobs:
  kirim-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kirim laporan order
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          pip install yagmail
          python -c "
          import yagmail, os, pathlib
          log = pathlib.Path('indrive_orders.log')
          body = log.read_text()[-4000:] if log.exists() else 'Tidak ada order baru'
          if not body.strip():
              body = 'Log kosong'
          yag = yagmail.SMTP(os.environ['EMAIL_ADDRESS'], os.environ['EMAIL_PASSWORD'])
          yag.send(to=os.environ['TO_EMAIL'], subject='🚗 Notifikasi inDrive Krembangan', contents=body)
          print('Email terkirim!')
          "
